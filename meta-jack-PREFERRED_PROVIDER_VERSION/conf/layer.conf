###################################################################################################
# We have a conf and classes directory, add to BBPATH
## BADDDD BBPATH .= ":${LAYERDIR}"
BBPATH := "${BBPATH}:${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "jack-PREFERRED_PROVIDER_VERSION"
BBFILE_PATTERN_jack-PREFERRED_PROVIDER_VERSION := "^${LAYERDIR}/"
BBFILE_PRIORITY_jack-PREFERRED_PROVIDER_VERSION = "5"

LAYERSERIES_COMPAT_jack-PREFERRED_PROVIDER_VERSION = "dunfell"

PREFERRED_PROVIDER_preferred-provider-version-driver ?= "preferred-provider-version-guava"

PREFERRED_VERSION_preferred-provider-version-guava ?= "230.1%"
#PREFERRED_VERSION_preferred-provider-version-guava ?= "240.1%"

